[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "license-plate-gt-generation"
version = "0.1.0"
description = "Vehicle motion detection, YOLOv8 ONNX license-plate detection, and FastOCR utilities"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.23",
    "opencv-python>=4.8",
    "matplotlib>=3.7",
    "ultralytics>=8.0",
    # macOS wheels include CoreMLExecutionProvider. Cap <1.26: 1.26.0 has no cp312 macOS wheel on PyPI.
    "onnxruntime>=1.17,<1.26",
    "onnx>=1.14",
    "fast-plate-ocr[onnx]",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools]
py-modules = [
    "license_plate_detection",
    "license_plate_recognition",
    "onnx_model_utils",
    "run_pipeline",
    "vehicle_detection",
    "video_utils",
]
